name: Validate scripts

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check shell syntax
        run: |
          find liveCDt -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash -n liveCDt/airootfs/usr/local/bin/livecd-sound
      - name: Check Python syntax
        run: python -m compileall -q liveCDt/tools
