LABEL arch
TEXT HELP
Boot the BonVel OS live medium on BIOS.
It allows you to install BonVel OS (Arch Linux) or perform system maintenance.
ENDTEXT
MENU LABEL BonVel OS live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the BonVel OS live medium on BIOS with speakup screen reader.
It allows you to install BonVel OS (Arch Linux) or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL BonVel OS live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G accessibility=on
