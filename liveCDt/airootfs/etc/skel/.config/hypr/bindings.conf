# Atalhos do BonVel OS
$terminal = foot
$browser = firefox
$menu = wofi --show drun

# Aplicações
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER ALT, RETURN, Tmux, exec, $terminal tmux new
bindd = SUPER, SPACE, Menu de aplicações, exec, pkill wofi || $menu
bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (privado), exec, $browser --private-window
bindd = SUPER SHIFT, M, Música (cmus), exec, $terminal cmus
bindd = SUPER SHIFT, N, Editor (neovim), exec, $terminal nvim
bindd = SUPER SHIFT, T, Monitor do sistema (htop), exec, $terminal htop

# Sites
bindd = SUPER SHIFT, A, ChatGPT, exec, $browser --new-window "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, $browser --new-window "https://grok.com"
bindd = SUPER SHIFT, Y, YouTube, exec, $browser --new-window "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, $browser --new-window "https://web.whatsapp.com/"
bindd = SUPER SHIFT, X, X, exec, $browser --new-window "https://x.com/"

# Janelas
bindd = SUPER, W, Fechar janela, killactive
bindd = SUPER, F, Ecrã inteiro, fullscreen, 0
bindd = SUPER, T, Alternar flutuante, togglefloating
bindd = SUPER, ESCAPE, Bloquear ecrã, exec, hyprlock
bindd = SUPER SHIFT, ESCAPE, Sair do Hyprland, exit

bindd = SUPER, LEFT, Foco à esquerda, movefocus, l
bindd = SUPER, RIGHT, Foco à direita, movefocus, r
bindd = SUPER, UP, Foco acima, movefocus, u
bindd = SUPER, DOWN, Foco abaixo, movefocus, d
bindd = SUPER SHIFT, LEFT, Mover janela à esquerda, movewindow, l
bindd = SUPER SHIFT, RIGHT, Mover janela à direita, movewindow, r
bindd = SUPER SHIFT, UP, Mover janela acima, movewindow, u
bindd = SUPER SHIFT, DOWN, Mover janela abaixo, movewindow, d
bindd = SUPER, MINUS, Encolher janela, resizeactive, -100 0
bindd = SUPER, EQUAL, Alargar janela, resizeactive, 100 0

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Áreas de trabalho
bindd = SUPER, 1, Área 1, workspace, 1
bindd = SUPER, 2, Área 2, workspace, 2
bindd = SUPER, 3, Área 3, workspace, 3
bindd = SUPER, 4, Área 4, workspace, 4
bindd = SUPER, 5, Área 5, workspace, 5
bindd = SUPER, 6, Área 6, workspace, 6
bindd = SUPER, 7, Área 7, workspace, 7
bindd = SUPER, 8, Área 8, workspace, 8
bindd = SUPER, 9, Área 9, workspace, 9
bindd = SUPER, 0, Área 10, workspace, 10
bindd = SUPER SHIFT, 1, Mover para área 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Mover para área 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Mover para área 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Mover para área 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Mover para área 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Mover para área 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Mover para área 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Mover para área 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Mover para área 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Mover para área 10, movetoworkspace, 10
bindd = SUPER, TAB, Próxima área, workspace, e+1
bindd = SUPER SHIFT, TAB, Área anterior, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Capturas de ecrã
bindd = , PRINT, Captura de região para a área de transferência, exec, grim -g "$(slurp)" - | wl-copy
bindd = SHIFT, PRINT, Captura do ecrã inteiro para ~/Pictures, exec, mkdir -p ~/Pictures && grim ~/Pictures/captura-$(date +%Y%m%d-%H%M%S).png

# Volume, brilho e multimédia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
