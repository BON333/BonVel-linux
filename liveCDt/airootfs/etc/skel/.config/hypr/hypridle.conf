general {
    lock_cmd = pidof hyprlock || hyprlock          # evita abrir dois bloqueios
    before_sleep_cmd = loginctl lock-session       # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on     # liga o ecrã ao acordar
}

listener {
    timeout = 300                                  # 5 min: bloqueia
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                  # 5,5 min: desliga o ecrã
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
