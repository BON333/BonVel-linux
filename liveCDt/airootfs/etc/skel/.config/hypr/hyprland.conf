# Configuração do Hyprland do BonVel OS: https://wiki.hyprland.org/Configuring/
# Independente do Omarchy. Só usa programas que vêm na ISO.

# Aspeto (cores, bordas, blur, animações) vem do tema ativo
source = ~/.config/omarchy/current/theme/hyprland.conf

# Ficheiros de configuração pessoal (sobrepõem o que está acima)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Variáveis de ambiente
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
}

# Janelas flutuantes para diálogos e utilitários
windowrule = match:class (pavucontrol|nm-connection-editor|blueberry.py), float on
windowrule = match:title (Open File|Save File|Abrir ficheiro|Guardar ficheiro), float on
windowrule = match:class org.bonvel.boasvindas, float on, size 720 520, center on, opaque on
