# Programas que arrancam com o Hyprland
exec-once = waybar
exec-once = mako
exec-once = swaybg -i ~/.config/omarchy/current/background -m fill

# Bloqueio automático só para utilizadores normais: na ISO ao vivo o root não tem
# palavra-passe e o hyprlock deixaria o ecrã bloqueado sem forma de entrar.
exec-once = [ "$(id -u)" -ne 0 ] && hypridle
