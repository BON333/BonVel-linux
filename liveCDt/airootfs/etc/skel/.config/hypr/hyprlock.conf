source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMonoNL Nerd Font
    font_color = $font_color

    placeholder_text = Palavra-passe
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

# Frase de Nietzsche, só no modo Übermensch
label {
    monitor =
    text = cmd[update:0] ubermensch bloqueio
    font_family = JetBrainsMonoNL Nerd Font
    font_size = 18
    color = rgba(ffffffcc)
    position = 0, -140
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = false
}
